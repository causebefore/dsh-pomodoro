name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    if: >-
      github.repository == 'causebefore/dsh-pomodoro' &&
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          if ($package.version -notmatch "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$") {
            throw "Only stable semantic versions are configured for automatic npm publishing."
          }

          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match package version '$($package.version)'. Expected '$expectedTag'."
          }

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch origin/main."
          }

          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:RELEASE_TAG' does not point to a commit on main."
          }

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish
